spring.application.name=LeafDocBackend

# SERVER
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/api

# CONFIGURATION
spring.config.import=optional:file:.env[.properties]

# LOGGING
logging.level.org.springframework=INFO
logging.level.com.example.leafdoc=DEBUG
#logging.level.org.springframework.security=TRACE
#logging.level.org.hibernet.SQL=DEBUG  # shows sql query
#logging.level.org.hibernet.orm.jdbc.bind=TRACE #shows sql param values

# DATABASE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# MAIL
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
app.jwt.secret=3mGxduVcoVw9gxjlmqW4NgvlVFkxzsqA3Sn8Yyjyri1Rln82vE8WfOQ93KBiw6Ckjpj/nS18wXzMXR0952G+YQ==
app.jwt.expiration=24h

# CORS
app.cors.allowed-origin=http://localhost:5713

# ML SERVICE
app.ml.service.url=http://localhost:8000
app.ml.service.key=SECRET_KEY
app.ml.upload.max-size=5MB

# MAIL APPLICATION SETTINGS
app.mail.from=${MAIL_FROM}

